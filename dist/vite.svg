<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#4c1d95" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#4c1d95" stroke-width="1" opacity="0.5"/>

  <!-- Axes -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="52" x2="16" y2="12" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

  <!-- Curve (representing a function) -->
  <path d="M 16 44 Q 28 20 40 36 T 52 24" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>

  <!-- y=x line -->
  <line x1="16" y1="48" x2="48" y2="16" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>

  <!-- Fixed point dot -->
  <circle cx="34" cy="30" r="4" fill="#22d3ee" stroke="#fff" stroke-width="1.5"/>

  <!-- Iteration step visualization -->
  <polyline points="22,42 22,34 28,34" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
